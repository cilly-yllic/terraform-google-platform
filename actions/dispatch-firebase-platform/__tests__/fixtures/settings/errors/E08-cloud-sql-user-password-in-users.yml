# Error fixture: users[].cloud_sql に password を書いている (BUILT_IN は
# data_connect 側に書くべき) → fail-fast
service: err-svc
environments:
  prd-001:
    billing_account_id: "AAAA-AAAA-AAAA"
    firebase_platform:
      firebase: true
      users:
        - email: owner@corp.com
          role: owner
          cloud_sql:
            instance_id: err-fdc
            password: nope # ここには password を書けない
      data_connect:
        - service_id: main
          location: asia-northeast1
          cloud_sql:
            instance_id: err-fdc
            database: main
